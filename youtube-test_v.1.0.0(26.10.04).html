<!doctype html>
<!--
변경 이력
| 버전    | 날짜     | 수정 내용 |
| v.1.0.0 | 26.10.04 | 최초 작성 — 유튜브 영상(q1v1_btl19w) 1:10~1:15 구간만 클릭 한 번으로 재생·자동 정지하는 테스트 슬라이드 |
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>유튜브 구간 재생 테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  /* 한 화면 슬라이드: 상단 제목 · 가운데 16:9 영상 · 하단 상태줄 */
  :root{--bg:#0b1220;--panel:#121b2d;--line:#26334d;--fg:#e9eef7;--muted:#9aa8bf;--accent:#4fc3f7;--gold:#ffd54f;
        --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:dark}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;gap:14px;padding-block:20px;padding-inline:clamp(16px,4vw,48px);box-sizing:border-box}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(20px,2.6vw,30px);text-wrap:balance}
  .range{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
  .stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .frame{position:relative;width:min(100%,calc((100vh - 170px)*16/9));aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden;cursor:pointer}
  #player,.frame iframe{position:absolute;inset:0;width:100%;height:100%}
  .cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,18,32,.82);text-align:center;padding:16px}
  .cover b{font-size:clamp(22px,3vw,36px)}
  .cover span{color:var(--muted)}
  .play{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
  .play::before{content:"";border-left:28px solid #06121f;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:8px}
  footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
  #status{color:var(--fg);font-variant-numeric:tabular-nums}
  button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:focus-visible,.frame:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<header>
  <h1>요즘 판교사투리 1. "하네스 엔지니어링"</h1>
  <div class="range">구간 1:10 ~ 1:15</div>
</header>

<div class="stage">
  <div class="frame" id="frame" tabindex="0" role="button" aria-label="정해진 구간 재생">
    <div id="player"></div>
    <div class="cover" id="cover">
      <div class="play" aria-hidden="true"></div>
      <b>클릭하면 1:10부터 재생</b>
      <span>1:15가 되면 저절로 멈춥니다 · 스페이스바도 됩니다</span>
    </div>
  </div>
</div>

<footer>
  <div id="status">준비 중…</div>
  <div><button id="again" type="button">다시 재생</button></div>
</footer>

<script>
  // 이 슬라이드의 영상 설정 — 숫자만 바꾸면 구간이 바뀝니다
  const CLIP = { id: "q1v1_btl19w", start: 70, end: 75 };

  const statusEl = document.getElementById("status");
  const cover = document.getElementById("cover");
  let player, ready = false, watch = null;
  const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");

  function setStatus(t){ statusEl.textContent = t; }

  function playClip(){
    if(!ready){ setStatus("영상이 아직 준비되지 않았습니다. 잠시 후 다시 눌러 주세요."); return; }
    cover.hidden = true;
    player.loadVideoById({ videoId: CLIP.id, startSeconds: CLIP.start, endSeconds: CLIP.end });
    clearInterval(watch);
    // 끝 시간 보조 감시 (endSeconds가 무시되는 경우 대비)
    watch = setInterval(() => {
      const t = player.getCurrentTime ? player.getCurrentTime() : 0;
      setStatus("재생 중 " + fmt(t) + " / 끝 " + fmt(CLIP.end));
      if (t >= CLIP.end - 0.05) stopClip();
    }, 100);
  }
  function stopClip(){
    clearInterval(watch);
    try { player.pauseVideo(); } catch(e){}
    setStatus("멈춤 — " + fmt(CLIP.end) + "에서 자동 정지했습니다. (다음 클릭 → 다음 슬라이드)");
  }

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player("player", {
      videoId: CLIP.id,
      playerVars: { start: CLIP.start, end: CLIP.end, rel: 0, modestbranding: 1, playsinline: 1, controls: 0, origin: location.origin },
      events: {
        onReady: () => { ready = true; setStatus("준비 완료 — 화면을 클릭하세요"); },
        onStateChange: e => { if (e.data === YT.PlayerState.ENDED) stopClip(); },
        onError: e => setStatus("재생 오류 " + e.data + " — 웹 주소(https)로 열었는지, 영상 퍼가기가 허용됐는지 확인하세요.")
      }
    });
  };

  document.getElementById("frame").addEventListener("click", playClip);
  document.getElementById("again").addEventListener("click", playClip);
  document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playClip(); } });

  if (location.protocol === "file:") setStatus("PC 파일로 열었습니다. 유튜브는 웹 주소(https)로 열어야 재생됩니다.");
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
</script>
</body>
</html>
