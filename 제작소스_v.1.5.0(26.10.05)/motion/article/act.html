<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="gsap.min.js"></script><style>
@font-face{font-family:"Pretendard";src:url("PretendardVariable.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0b0b}
#root{width:100%;height:100%;position:relative;font-family:"Pretendard",sans-serif;color:#f4f4f2;background:radial-gradient(ellipse 70% 80% at 42% 45%,#2a2725 0%,#151312 55%,#0c0b0b 100%)}
.ghost{position:absolute;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.12)}
.gh{right:110px;top:110px;font-size:200px;font-weight:900;letter-spacing:-.04em}
.lbl{position:absolute;left:150px;top:150px;font-size:24px;font-weight:700;letter-spacing:.22em;color:#ff5a1f}
.hline{position:absolute;left:150px;right:110px;top:200px;height:1px;background:rgba(255,255,255,.28)}
.q{position:absolute;left:150px;top:270px;font-size:52px;font-weight:700;color:#cbc5ba}
.sq{position:absolute;left:84px;top:330px;width:56px;height:56px;border:3px solid #f4f4f2}
.m1{position:absolute;left:150px;top:350px;font-size:190px;font-weight:900;letter-spacing:-.045em;line-height:1}
.m2{position:absolute;left:150px;top:560px;font-size:190px;font-weight:900;letter-spacing:-.045em;line-height:1;color:#ff5a1f}
.chips{position:absolute;left:150px;right:110px;bottom:120px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.chip{border:1.5px solid rgba(255,255,255,.16);border-radius:22px;background:#1d1a19;padding:28px 32px}
.chip b{display:block;font-size:22px;font-weight:800;letter-spacing:.2em;color:#ff5a1f}
.chip span{display:block;font-size:40px;font-weight:800;margin-top:10px}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="ghost gh clip" data-start="0" data-duration="6" data-track-index="0">Start.</div>
<div class="lbl clip" data-start="0" data-duration="6" data-track-index="1">PART 3 · 06  우리 조직이 할 일</div>
<div class="hline clip" data-start="0" data-duration="6" data-track-index="2"></div>
<div class="q clip" data-start="0" data-duration="6" data-track-index="3">그래서, 우리 조직은?</div>
<div data-sq=".q" class="sq clip" data-start="0" data-duration="6" data-track-index="4"></div>
<div class="m1 clip" data-start="0" data-duration="6" data-track-index="5">일단 써 보세요.</div>
<div class="m2 clip" data-start="0" data-duration="6" data-track-index="6">작은 것부터.</div>
<div class="chips clip" data-start="0" data-duration="6" data-track-index="7"><div class="chip"><b>01</b><span>보고서 초안 한 장</span></div><div class="chip"><b>02</b><span>반복 업무 하나</span></div><div class="chip"><b>03</b><span>잘 된 것은 공유</span></div></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from(".lbl",{opacity:0,x:-30,duration:.5},0).from(".hline",{scaleX:0,transformOrigin:"left",duration:.8},0.1).from(".gh",{opacity:0,duration:1},0.3)
.from(".q",{opacity:0,y:20,duration:.6},0.4).from(".sq",{opacity:0,scale:.4,rotation:-45,duration:.6,ease:"back.out(1.8)"},0.9)
.from(".m1",{opacity:0,y:70,duration:.8,ease:"power3.out"},1.0).from(".m2",{opacity:0,y:70,duration:.8,ease:"power3.out"},1.6)
.from(".chip",{opacity:0,y:50,duration:.5,stagger:.2},2.4);
window.__timelines["main"]=tl;
(function(){
if(document.querySelector('.sqn')) tl.from('.sqn',{opacity:0,scale:.4,rotation:-45,duration:.6,ease:'back.out(1.8)'},0.5);
function firstText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?1:3});return w.nextNode();}
function place(){
  const st=document.createElement('style'); st.textContent='#root *{transform:none!important;translate:none!important;scale:none!important;rotate:none!important}'; document.head.appendChild(st);
  const cv=document.createElement('canvas').getContext('2d');
  document.querySelectorAll('[data-sq]').forEach(sq=>{
    const el=document.querySelector(sq.dataset.sq); if(!el) return; const tn=firstText(el); if(!tn) return;
    let i=0; while(i<tn.nodeValue.length && /\s/.test(tn.nodeValue[i])) i++;
    const ch=tn.nodeValue[i]; const r=document.createRange(); r.setStart(tn,i); r.setEnd(tn,i+1); const b=r.getBoundingClientRect();
    const cs=getComputedStyle(tn.parentElement); const f=parseFloat(cs.fontSize);
    cv.font=cs.fontWeight+' '+f+'px '+cs.fontFamily; const m=cv.measureText(ch);
    const base=b.top+(m.fontBoundingBoxAscent||0.93*f);
    const inkTop=base-m.actualBoundingBoxAscent, inkLeft=b.left-m.actualBoundingBoxLeft;
    const s=Math.round(Math.max(40,Math.min(90,0.45*f))), T=Math.max(3,Math.round(0.06*s)), c='#f4f4f2', g='linear-gradient('+c+','+c+')';
    const dx=parseFloat(sq.dataset.dx||0)*f, dy=parseFloat(sq.dataset.dy||0)*f; sq.style.left=(inkLeft-0.55*s+dx)+'px'; sq.style.top=(inkTop-0.55*s+dy)+'px'; sq.style.width=s+'px'; sq.style.height=s+'px';
    sq.style.right='auto'; sq.style.bottom='auto'; sq.style.border='none';
    sq.style.background=g+' left top/100% '+T+'px no-repeat,'+g+' left top/'+T+'px 100% no-repeat,'+g+' right top/'+T+'px 25% no-repeat,'+g+' left bottom/30% '+T+'px no-repeat';
  });
  st.remove();
}
place(); if(document.fonts) document.fonts.ready.then(place);
})();
tl.seek(0);
</script></body></html>
