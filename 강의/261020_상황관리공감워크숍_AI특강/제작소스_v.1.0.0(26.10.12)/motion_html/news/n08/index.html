<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="gsap.min.js"></script><style>@font-face{font-family:"Pretendard";src:url("PretendardVariable.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0b0b}
#root{width:100%;height:100%;position:relative;font-family:"Pretendard",sans-serif;color:#f4f4f2;background:radial-gradient(ellipse 70% 80% at 42% 45%,#2a2725 0%,#151312 55%,#0c0b0b 100%)}
.ghost{position:absolute;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.12)}
.gh{right:110px;bottom:30px;font-size:150px;font-weight:900;letter-spacing:-.04em}
.lbl{position:absolute;left:110px;top:120px;font-size:24px;font-weight:700;letter-spacing:.22em;color:#ff5a1f}
.ttl{position:absolute;left:110px;top:180px;width:780px;font-size:92px;font-weight:900;letter-spacing:-.035em;line-height:1.12;white-space:pre-line}
.src{position:absolute;left:110px;top:430px;display:flex;gap:16px;align-items:center;font-size:28px;font-weight:700}
.src b{font-size:20px;letter-spacing:.2em;color:#111;background:#f4f4f2;padding:6px 14px;border-radius:999px}
.lines{position:absolute;left:110px;top:510px;width:760px;border-top:1px solid rgba(255,255,255,.28)}
.ln{display:flex;gap:18px;align-items:flex-start;font-size:31px;font-weight:600;line-height:1.35;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.12);color:#e6e2da}
.ln i{flex:none;width:12px;height:12px;border-radius:50%;background:#ff5a1f;margin-top:15px}
.next{position:absolute;left:110px;top:860px;display:flex;gap:24px;align-items:center}
.next .pl{width:84px;height:84px;border-radius:50%;background:#ff5a1f;position:relative;flex:none}
.next .pl::before{content:"";position:absolute;left:33px;top:24px;border-left:26px solid #111;border-top:18px solid transparent;border-bottom:18px solid transparent}
.next b{display:block;font-size:36px;font-weight:800}
.next em{display:block;font-style:normal;font-size:24px;color:#a59f98;margin-top:6px}
.win{position:absolute;left:930px;top:190px;width:880px;border-radius:18px;overflow:visible;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bar{height:48px;background:#e9e6e3;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:10px;padding:0 18px}
.bar i{width:14px;height:14px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{margin-left:14px;flex:1;height:30px;border-radius:8px;background:#fff;color:#444;font-size:17px;display:flex;align-items:center;padding:0 14px;white-space:nowrap;overflow:hidden}
.view{position:relative;width:880px;height:640px;overflow:hidden;border-radius:0 0 18px 18px}
.shot{position:absolute;left:0;top:0;width:880px}
.hl{position:absolute;border:4px solid #ff5a1f;border-radius:8px;background:rgba(255,90,31,.08);box-sizing:border-box}
.badge{position:absolute;right:-18px;top:-22px;background:#ff5a1f;color:#111;font-size:24px;font-weight:900;padding:12px 22px;border-radius:999px;letter-spacing:.06em}
.sq{position:absolute;left:900px;top:160px;width:70px;height:70px;border:3px solid #f4f4f2}

.zoom{position:absolute;left:0;top:0;width:880px;height:640px}
.ln{color:#a59f98;font-weight:500}.ln b{color:#f4f4f2;font-weight:800}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="ghost gh clip" data-start="0" data-duration="6" data-track-index="0">News.</div>
<div class="lbl clip" data-start="0" data-duration="6" data-track-index="1">PART 1 · 3막 ⑤ · Dots</div>
<div data-sq=".ttl" class="sq clip" data-start="0" data-duration="6" data-track-index="7"></div>
<div class="ttl clip" data-start="0" data-duration="6" data-track-index="2">알아서 하는 AI,
'닷츠'</div>
<div class="src clip" data-start="0" data-duration="6" data-track-index="3"><b>출처</b>세계일보 · 2026. 9. 30</div>
<div class="lines clip" data-start="0" data-duration="6" data-track-index="4"><div class="ln l0"><i></i><span>오픈AI의 <b>알아서 하는 AI</b></span></div><div class="ln l1"><i></i><span>노트북을 덮어도 <b>24시간</b> 일합니다</span></div></div>
<div class="next clip" data-start="0" data-duration="6" data-track-index="5"><span class="pl"></span><div><b>영상으로 살펴보겠습니다</b><em>커리어해커 알렉스 · OpenAI dots</em></div></div>
<div class="win clip" data-start="0" data-duration="6" data-track-index="6">
  <div class="bar"><i></i><i></i><i></i><div class="url">🔒 segye.com/newsView/20260930510396</div></div>
  <div class="view"><div class="zoom" style="transform-origin:440px 176px"><img class="shot" src="cap.jpg"/><div class="hl" style="left:98px;top:155px;width:683px;height:42px"></div></div></div>
  <div class="badge">실제 기사</div>
</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from(".win",{opacity:0,y:40,duration:.6},0.1).fromTo(".shot, .hl",{y:-420},{y:0,duration:2.0,ease:"power3.out"},0.2).from(".ttl",{opacity:0,x:-60,duration:.8,ease:"power3.out"},0.35).from(".hl",{scaleX:0,transformOrigin:"left",duration:.6,ease:"power2.out"},1.6).to(".zoom",{scale:1.12,duration:2.0,ease:"power2.inOut"},2.6);tl.from(".lbl",{opacity:0,x:-30,duration:.5},0).from(".sq",{opacity:0,scale:.4,rotation:-45,duration:.6,ease:"back.out(1.8)"},0.6).from(".gh",{opacity:0,duration:1},0.5).from(".src",{opacity:0,y:20,duration:.5},0.9).from(".badge",{scale:0,duration:.45,ease:"back.out(2)"},1.8).from(".ln",{opacity:0,x:-24,duration:.5,stagger:.25},1.7).from(".next",{opacity:0,y:20,duration:.6},2.6).from(".url",{clipPath:"inset(0 100% 0 0)",duration:.9,ease:"none"},0.5).fromTo(".next .pl",{scale:1},{scale:1.12,duration:.5,yoyo:true,repeat:3,ease:"sine.inOut"},3.3);
window.__timelines["main"]=tl;
(function(){
if(document.querySelector('.sqn')) tl.from('.sqn',{opacity:0,scale:.4,rotation:-45,duration:.6,ease:'back.out(1.8)'},0.5);
function firstText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?1:3});return w.nextNode();}
function place(){
  const st=document.createElement('style'); st.textContent='#root *{transform:none!important;translate:none!important;scale:none!important;rotate:none!important}'; document.head.appendChild(st);
  const cv=document.createElement('canvas').getContext('2d');
  document.querySelectorAll('[data-sq]').forEach(sq=>{
    const el=document.querySelector(sq.dataset.sq); if(!el) return; const tn=firstText(el); if(!tn) return;
    let i=0; while(i<tn.nodeValue.length && /\s/.test(tn.nodeValue[i])) i++;
    const ch=tn.nodeValue[i]; const r=document.createRange(); r.setStart(tn,i); r.setEnd(tn,i+1); const b=r.getBoundingClientRect();
    const cs=getComputedStyle(tn.parentElement); const f=parseFloat(cs.fontSize);
    cv.font=cs.fontWeight+' '+f+'px '+cs.fontFamily; const m=cv.measureText(ch);
    const base=b.top+(m.fontBoundingBoxAscent||0.93*f);
    const inkTop=base-m.actualBoundingBoxAscent, inkLeft=b.left-m.actualBoundingBoxLeft;
    const s=Math.round(Math.max(40,Math.min(90,0.45*f))), T=Math.max(3,Math.round(0.06*s)), c='#f4f4f2', g='linear-gradient('+c+','+c+')';
    const dx=parseFloat(sq.dataset.dx||0)*f, dy=parseFloat(sq.dataset.dy||0)*f; sq.style.left=(inkLeft-0.55*s+dx)+'px'; sq.style.top=(inkTop-0.55*s+dy)+'px'; sq.style.width=s+'px'; sq.style.height=s+'px';
    sq.style.right='auto'; sq.style.bottom='auto'; sq.style.border='none';
    sq.style.background=g+' left top/100% '+T+'px no-repeat,'+g+' left top/'+T+'px 100% no-repeat,'+g+' right top/'+T+'px 25% no-repeat,'+g+' left bottom/30% '+T+'px no-repeat';
  });
  st.remove();
}
place(); if(document.fonts) document.fonts.ready.then(place);
})();
tl.seek(0);
</script></body></html>
