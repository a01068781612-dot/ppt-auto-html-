<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/><script src="gsap.min.js"></script><style>@font-face{font-family:"Pretendard";src:url("PretendardVariable.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0b0b}
#root{width:100%;height:100%;position:relative;font-family:"Pretendard",sans-serif;color:#f4f4f2;background:radial-gradient(ellipse 70% 80% at 42% 45%,#2a2725 0%,#151312 55%,#0c0b0b 100%)}
.ghost{position:absolute;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.13);pointer-events:none}
.sq{position:absolute;border:3px solid #f4f4f2}
.vline{position:absolute;width:1px;background:rgba(255,255,255,.28)}
.hline{position:absolute;height:1px;background:rgba(255,255,255,.28)}
.dots{position:absolute;display:flex;gap:14px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6)}.dots i.on{background:#ff5a1f;border-color:#ff5a1f}
.brand{position:absolute;font-size:22px;letter-spacing:.25em;color:#8a847e}
.ct{position:absolute;left:110px;top:96px;font-size:120px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ctg{left:110px;top:150px;font-size:120px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ctsub{position:absolute;left:900px;top:150px;font-size:30px;color:#a59f98}
.cards{position:absolute;left:110px;right:110px;top:300px;bottom:110px;display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:34px}
.card{position:relative;background:linear-gradient(180deg,#262321 0%,#1a1817 100%);border-radius:28px;padding:64px 44px 44px;display:flex;flex-direction:column;border:1.5px solid rgba(255,255,255,.08)}
.card.main{border:2.5px solid #ff5a1f;background:linear-gradient(180deg,#2c2724 0%,#1d1a18 100%)}
.pill{position:absolute;top:-24px;left:48px;background:#f4f4f2;color:#111;font-size:22px;font-weight:800;letter-spacing:.18em;padding:12px 26px;border-radius:999px}
.card.main .pill{background:#ff5a1f;color:#111}
.num{font-size:150px;font-weight:900;line-height:.9;letter-spacing:-.05em;color:#f4f4f2}
.card .num{-webkit-text-stroke:0}
.card.main .num{color:#ff5a1f}
.t{font-size:54px;font-weight:800;letter-spacing:-.02em;margin-top:26px;line-height:1.18}
.ul{margin-top:30px;border-top:1px solid rgba(255,255,255,.14)}
.ul div{font-size:28px;white-space:nowrap;color:#d6d2c9;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.min{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:24px}
.min b{font-size:56px;font-weight:900}.min b small{font-size:28px;font-weight:600;margin-left:6px;color:#a59f98}
.min span{font-size:24px;letter-spacing:.2em;color:#8a847e}
.card.main .min b{color:#ff5a1f}
*{word-break:keep-all;overflow-wrap:break-word}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div class="ghost ctg clip" data-start="0" data-duration="5" data-track-index="0">Contents.</div>
<div data-sq=".ct" class="sq sqn clip" data-start="0" data-duration="5" data-track-index="99"></div>
<div class="ct clip" data-start="0" data-duration="5" data-track-index="1">Contents.</div>
<div class="ctsub clip" data-start="0" data-duration="5" data-track-index="2">오늘 강의는 이렇게 진행합니다</div>
<div class="hline clip" style="left:900px;right:110px;top:208px" data-start="0" data-duration="5" data-track-index="3"></div>
<div class="cards clip" data-start="0" data-duration="5" data-track-index="4">
 <div class="card c1"><div class="pill">PART 1</div><div class="num">01</div><div class="t">국토부 실습<br>돌아보기</div>
  <div class="ul"><div>ChatGPT · Gemini · NotebookLM</div><div>Claude로 만든 업무 도구</div><div>실제 HTML 시연</div></div>
  <div class="min"><span>REVIEW</span></div></div>
 <div class="card main c2"><div class="pill">PART 2 · MAIN</div><div class="num">02</div><div class="t">2026 AI 트렌드</div>
  <div class="ul"><div>에이전트 · AX — 일하는 AI</div><div>프롬프트 → 컨텍스트 → 하네스</div><div>Hermes · Aside · Jev · Muse · Dots</div></div>
  <div class="min"><span>TREND</span></div></div>
 <div class="card c3"><div class="pill">PART 3</div><div class="num">03</div><div class="t">기관도<br>변하고 있다</div>
  <div class="ul"><div>승진 · 가산점 · 포상 제도</div><div>기관장과 현장의 변화</div><div>우리 조직이 할 일</div></div>
  <div class="min"><span>CHANGE</span></div></div>
</div>
<div class="dots clip" style="right:110px;top:140px" data-start="0" data-duration="5" data-track-index="5"><i></i><i class="on"></i><i></i><i></i></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from(".ct",{opacity:0,x:-60,duration:.8,ease:"power3.out"},0)
.from(".ctg",{opacity:0,y:-30,duration:1.1},0.35)
.from(".hline",{scaleX:0,transformOrigin:"left",duration:.8},0.3)
.from(".ctsub,.dots",{opacity:0,duration:.6},0.5)
.from(".c1",{opacity:0,y:80,duration:.7,ease:"power3.out"},0.8)
.from(".c2",{opacity:0,y:80,duration:.7,ease:"power3.out"},1.0)
.from(".c3",{opacity:0,y:80,duration:.7,ease:"power3.out"},1.2)
.from(".c2",{scale:.96,duration:.5,ease:"back.out(2)"},1.9);
window.__timelines["main"]=tl;
(function(){
if(document.querySelector('.sqn')) tl.from('.sqn',{opacity:0,scale:.4,rotation:-45,duration:.6,ease:'back.out(1.8)'},0.5);
function firstText(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()?1:3});return w.nextNode();}
function place(){
  const st=document.createElement('style'); st.textContent='#root *{transform:none!important;translate:none!important;scale:none!important;rotate:none!important}'; document.head.appendChild(st);
  const cv=document.createElement('canvas').getContext('2d');
  document.querySelectorAll('[data-sq]').forEach(sq=>{
    const el=document.querySelector(sq.dataset.sq); if(!el) return; const tn=firstText(el); if(!tn) return;
    let i=0; while(i<tn.nodeValue.length && /\s/.test(tn.nodeValue[i])) i++;
    const ch=tn.nodeValue[i]; const r=document.createRange(); r.setStart(tn,i); r.setEnd(tn,i+1); const b=r.getBoundingClientRect();
    const cs=getComputedStyle(tn.parentElement); const f=parseFloat(cs.fontSize);
    cv.font=cs.fontWeight+' '+f+'px '+cs.fontFamily; const m=cv.measureText(ch);
    const base=b.top+(m.fontBoundingBoxAscent||0.93*f);
    const inkTop=base-m.actualBoundingBoxAscent, inkLeft=b.left-m.actualBoundingBoxLeft;
    const s=Math.round(Math.max(40,Math.min(90,0.45*f))), T=Math.max(3,Math.round(0.06*s)), c='#f4f4f2', g='linear-gradient('+c+','+c+')';
    const dx=parseFloat(sq.dataset.dx||0)*f, dy=parseFloat(sq.dataset.dy||0)*f; sq.style.left=(inkLeft-0.55*s+dx)+'px'; sq.style.top=(inkTop-0.55*s+dy)+'px'; sq.style.width=s+'px'; sq.style.height=s+'px';
    sq.style.right='auto'; sq.style.bottom='auto'; sq.style.border='none';
    sq.style.background=g+' left top/100% '+T+'px no-repeat,'+g+' left top/'+T+'px 100% no-repeat,'+g+' right top/'+T+'px 25% no-repeat,'+g+' left bottom/30% '+T+'px no-repeat';
  });
  st.remove();
}
place(); if(document.fonts) document.fonts.ready.then(place);
})();
tl.seek(0);
</script></body></html>
