<!doctype html>
<!--

| v.1.2.1 | 26.10.04 | 재생기 v.1.1.1로 교체 — 시작할 때 유튜브 자막 꺼짐 |
| v.1.2.0 | 26.10.04 | 재생기 v.1.1.0으로 교체 — 클릭하면 전체화면, 유튜브 기본 조작 화면 사용, 구간 안 자유 이동·구간 밖 차단, 끝에서 자동 정지 |
| v.1.1.3 | 26.10.04 | 재생기 v.1.0.3으로 교체 — 영상 화면 아래 현재 시간·진행 막대 표시, 하단 상태줄 글자 키움 |
| v.1.1.2 | 26.10.04 | 재생기 v.1.0.2로 교체 — 광고 중 '건너뛰기' 클릭 가능 |
| v.1.1.1 | 26.10.04 | 재생기 v.1.0.1로 교체(안내 문구 사라짐, 광고 표시), 상태줄에 '광고 또는 불러오는 중' 표시 |
| v.1.1.0 | 26.10.04 | 구조 변경 — 유튜브를 직접 넣지 않고, 웹(GitHub Pages)에 올린 재생기(yt-player)를 불러오는 방식. 내려받은 HTML을 PC에서 더블클릭해도 재생됨(인터넷 필요) |

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 구간 재생 테스트</title>
<style>
  :root{--bg:#0b1220;--panel:#121b2d;--line:#26334d;--fg:#e9eef7;--muted:#9aa8bf;--accent:#4fc3f7;--gold:#ffd54f;color-scheme:dark}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;gap:14px;padding-block:20px;padding-inline:clamp(16px,4vw,48px);box-sizing:border-box}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(20px,2.6vw,30px)}
  .range{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .frame{position:relative;width:min(100%,calc((100vh - 170px)*16/9));aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
  #status{color:var(--gold);font-size:clamp(16px,1.8vw,22px);font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>요즘 판교사투리 1. "하네스 엔지니어링"</h1>
  <div class="range">구간 1:10 ~ 1:15</div>
</header>
<div class="stage">
  <div class="frame">
    <iframe id="clip" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="영상 구간"></iframe>
  </div>
</div>
<footer>
  <div id="status">영상 불러오는 중…</div>
  <div>영상 화면 클릭 → 전체화면 재생 · ESC → 전체화면 나가기</div>
</footer>
<script>
  // 재생기 주소 (GitHub Pages) + 이 슬라이드의 영상 설정
  const PLAYER = "https://a01068781612-dot.github.io/ppt-auto-html-/yt-player_v.1.1.2%2826.10.04%29.html";
  const CLIP = { v: "q1v1_btl19w", s: 70, e: 75 };
  const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
  const frame = document.getElementById("clip"), statusEl = document.getElementById("status");
  frame.src = PLAYER + "?v=" + CLIP.v + "&s=" + CLIP.s + "&e=" + CLIP.e;
  window.addEventListener("message", e => {
    const d = e.data || {}; if (!d.ytClip) return;
    if (d.state === "ready") statusEl.textContent = "준비 완료 — 영상 화면을 클릭하세요";
    if (d.state === "loading") statusEl.textContent = "광고 또는 불러오는 중… 건너뛰기가 보이면 누르세요. 본 영상은 " + fmt(CLIP.s) + "부터 시작합니다";
    if (d.state === "playing") statusEl.textContent = "재생 중 " + fmt(d.t) + " (구간 " + fmt(CLIP.s) + " ~ " + fmt(CLIP.e) + ")";
    if (d.state === "ended") statusEl.textContent = "멈춤 — " + fmt(CLIP.e) + "에서 자동 정지했습니다";
    if (d.state === "error") statusEl.textContent = "재생 오류 " + d.code;
  });
  document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); frame.contentWindow.postMessage({ cmd: "play" }, "*"); } });
</script>
</body>
</html>
