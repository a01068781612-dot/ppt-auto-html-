<!doctype html>
<!--
변경 이력
| 버전    | 날짜     | 수정 내용 |
| v.1.0.0 | 26.10.05 | 최초 작성 — PART 1 국토부 실습 돌아보기. HyperFrames 표지 모션 → 9.7판 원본 87장(ChatGPT 47~61 → Gemini 62~78 → NotebookLM 80~101 → Claude 5~21·30~45, 도구 2 제외. 원본 목차 4번은 Claude가 1번으로 적혀 있어 진행 순서와 달라 빼고 표지 모션으로 대신) → 실제 시연 화면(도구 1·도구 3). 글꼴 Pretendard, 디자인지침 v.1.0.0 색상 |

조작: → / 스페이스 / 클릭 = 다음, ← = 이전, F = 전체화면, Home = 처음, 숫자+Enter = 해당 장으로
폴더 구성: 이 HTML + assets/(글꼴·원본 이미지·모션 영상) + 도구/(국토부 강의 실습 HTML을 넣어 두는 곳)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 특강 PART 1</title>
<style>
  @font-face{font-family:"Pretendard";src:url("assets/fonts/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
  :root{
    --bg:#110f0e; --bg2:#171413; --card:#1a1716; --line:#3a3330;
    --fg:#f4f4f2; --body:#cbc5ba; --cap:#b5b0a7; --dim:#6f6862;
    --accent:#ff5a1f; --accent2:#ff7a45;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:"Pretendard",system-ui,sans-serif;color:var(--fg);cursor:none}
  body.cur{cursor:default}

  /* 16:9 무대 — 화면 크기에 맞춰 1920×1080을 축소/확대 */
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease}
  .slide.on{opacity:1;visibility:visible}
  .slide.img{background:#fff}
  .slide.img img{width:100%;height:100%;object-fit:contain;display:block}
  .slide video{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}

  /* 디자인 슬라이드 공통 */
  .pg{position:absolute;left:0;bottom:0;width:96px;height:96px;background:var(--accent);color:var(--bg);font-size:30px;font-weight:800;display:grid;place-items:center}
  .vert{position:absolute;left:52px;top:140px;writing-mode:vertical-rl;font-size:18px;letter-spacing:.4em;color:var(--dim)}
  .lbl{font-size:30px;font-weight:600;letter-spacing:.35em;color:var(--accent)}
  .bar{height:4px;width:240px;background:var(--accent);margin:26px 0 40px}

  /* 시연 화면 */
  .demo{padding:110px 140px 0 140px}
  .demo h2{font-size:88px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .demo p.sub{font-size:36px;color:var(--body);margin-top:24px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px;max-width:1500px}
  .tool{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);padding:40px 48px;transition:border-color .2s,transform .2s}
  .tool:hover{border-color:var(--accent);transform:translateY(-4px)}
  .tool .no{font-size:26px;font-weight:700;letter-spacing:.3em;color:var(--accent)}
  .tool b{display:block;font-size:52px;font-weight:800;margin:12px 0 16px}
  .tool span{font-size:30px;color:var(--cap);line-height:1.5}
  .tool .go{display:block;margin-top:22px;font-size:28px;font-weight:700;color:var(--accent)}
  .demo .note,.note{position:absolute;right:60px;bottom:34px;font-size:22px;color:var(--dim)}
  .slide.on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .slide.on .rise.d1{animation-delay:.12s}.slide.on .rise.d2{animation-delay:.24s}.slide.on .rise.d3{animation-delay:.4s}.slide.on .rise.d4{animation-delay:.52s}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  .slide.on .grow{animation:grow .6s .2s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}

  /* 진행 표시 (아래 2px) · 멈출 장면 표시(강사용 작은 점) */
  #prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s;z-index:5}
  #star{position:absolute;right:18px;bottom:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:0;z-index:5}
  #star.on{opacity:.85}
  #hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(23,20,19,.92);border:1px solid var(--line);color:var(--body);font-size:15px;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:10}
  #hint.on{opacity:1}
  #jump{position:fixed;right:24px;top:20px;background:var(--bg2);border:1px solid var(--accent);color:var(--fg);font:600 20px "Pretendard",sans-serif;padding:8px 14px;border-radius:6px;display:none;z-index:10}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hint">→ 다음 · ← 이전 · F 전체화면 · 숫자+Enter 이동</div>
<div id="jump"></div>

<script>
/* ───────── 슬라이드 목록 ─────────
   type: "motion"(HyperFrames 영상, 들어오면 자동 재생 후 마지막 장면 정지) / "img"(국토부 9.7판 원본) / "demo"(시연 화면)
   star: 잠깐 멈춰 설명할 장면 (오른쪽 아래 작은 주황 점으로 강사에게만 표시) */
const ORIGINAL = n => "assets/molit/s-" + String(n).padStart(3, "0") + ".jpg";
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const STARS = new Set([50, 57, 60, 65, 75, 85, 95, 101, 11, 20, 30, 45]);

const SLIDES = [
  { type: "motion", src: "assets/motion/part1_cover.mp4", poster: "assets/motion/part1_cover_last.jpg", label: "표지" },
  ...range(47, 61).map(n => ({ type: "img", n, label: "ChatGPT" })),
  ...range(62, 78).map(n => ({ type: "img", n, label: "Gemini" })),
  ...range(80, 101).map(n => ({ type: "img", n, label: "NotebookLM" })),
  ...range(5, 21).map(n => ({ type: "img", n, label: "Claude 실습 1" })),
  ...range(30, 45).map(n => ({ type: "img", n, label: "Claude 실습 3·가이드" })),
  { type: "demo", label: "실제 시연" },
];

const stage = document.getElementById("stage");

function demoHTML(){
  return `
  <div class="vert">2026 AI 특강 · 경남소방본부</div>
  <div class="demo">
    <div class="lbl rise">LIVE DEMO</div>
    <div class="bar grow"></div>
    <h2 class="rise d1">말로 만든 업무 도구,<br>지금 바로 써 보겠습니다</h2>
    <p class="sub rise d2">국토부 실습에서 만든 HTML 도구에 실제 엑셀 파일을 넣어 봅니다</p>
    <div class="tools">
      <a class="tool rise d3" href="도구/1.도구1_시각화 자료만들기.html" target="_blank">
        <div class="no">TOOL 01</div>
        <b>시각화 자료 만들기</b>
        <span>엑셀 올리기 → 그래프 자동 생성<br>→ PNG 저장 → 한글 보고서에 붙여넣기</span>
        <div class="go">도구 열기 ↗</div>
      </a>
      <a class="tool rise d4" href="도구/3.도구3_취합검증기.html" target="_blank">
        <div class="no">TOOL 03</div>
        <b>취합 검증기</b>
        <span>여러 기관 엑셀을 한 번에 대조<br>→ 누락·중복·오타까지 표시</span>
        <div class="go">도구 열기 ↗</div>
      </a>
    </div>
  </div>
  <div class="note">도구 파일은 이 HTML과 같은 폴더의 「도구」 폴더에 넣어 두세요</div>
  <div class="pg">12</div>`;
}

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + s.type;
  el.dataset.i = i;
  if (s.type === "img") {
    el.innerHTML = `<img alt="국토부 실습 원본 ${s.n}" decoding="async" ${i < 4 ? `src="${ORIGINAL(s.n)}"` : `data-src="${ORIGINAL(s.n)}"`}>`;
  } else if (s.type === "motion") {
    el.innerHTML = `<video src="${s.src}" poster="${s.poster}" muted playsinline preload="auto"></video>`;
  } else if (s.type === "demo") {
    el.innerHTML = demoHTML();
  }
  stage.appendChild(el);
});
stage.insertAdjacentHTML("beforeend", '<div id="prog"></div><div id="star"></div>');

const els = [...stage.querySelectorAll(".slide")];
const prog = document.getElementById("prog"), star = document.getElementById("star");
let cur = -1;

function load(i){
  const img = els[i] && els[i].querySelector("img[data-src]");
  if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); }
}
function go(i){
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  if (i === cur) return;
  if (cur >= 0) {
    els[cur].classList.remove("on");
    const v = els[cur].querySelector("video"); if (v) v.pause();
  }
  cur = i;
  load(i); load(i + 1); load(i + 2); load(i - 1);
  const el = els[i];
  el.classList.add("on");
  const v = el.querySelector("video");
  if (v) { v.currentTime = 0; v.play().catch(() => {}); }   // 모션: 처음부터 재생, 끝나면 마지막 장면에서 멈춤
  prog.style.width = ((i + 1) / SLIDES.length * 100) + "%";
  const s = SLIDES[i];
  star.classList.toggle("on", s.type === "img" && STARS.has(s.n));
  try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
}

/* 화면 맞춤 */
function fit(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener("resize", fit); fit();

/* 조작 */
let typed = "";
const jump = document.getElementById("jump");
function full(){
  const d = document.documentElement;
  if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
  else document.exitFullscreen();
}
addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) { typed += e.key; jump.textContent = typed + "번으로"; jump.style.display = "block"; return; }
  if (e.key === "Enter" && typed) { go(parseInt(typed, 10) - 1); typed = ""; jump.style.display = "none"; return; }
  if (e.key === "Escape" && typed) { typed = ""; jump.style.display = "none"; return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(SLIDES.length - 1);
  else if (e.key === "f" || e.key === "F") full();
});
stage.addEventListener("click", e => {
  if (e.target.closest("a")) return;                         // 시연 화면의 도구 버튼은 그대로 열림
  if (e.clientX < innerWidth * 0.15) go(cur - 1); else go(cur + 1);
});

/* 마우스 움직이면 커서·도움말 잠깐 표시 */
let hideT;
const hint = document.getElementById("hint");
addEventListener("mousemove", () => {
  document.body.classList.add("cur"); hint.classList.add("on");
  clearTimeout(hideT); hideT = setTimeout(() => { document.body.classList.remove("cur"); hint.classList.remove("on"); }, 1800);
});

/* 시작: 주소 뒤 #번호가 있으면 그 장부터 */
const start = parseInt((location.hash || "").slice(1), 10);
document.fonts.ready.then(() => go(isNaN(start) ? 0 : start - 1));
</script>
</body>
</html>
